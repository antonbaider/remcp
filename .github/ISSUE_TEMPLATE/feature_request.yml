name: Feature request
description: Propose a new ReMCP capability or improvement.
title: "[Feature] "
body:
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: What should a user or agent be able to accomplish?
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current limitation
      description: What prevents that workflow today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful behavior or contract.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Device client / pairing
        - Local runtime / MCP tools
        - Desktop or browser control
        - Files / terminal / documents
        - Plugin or marketplace integration
        - Release / npm package
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Security or compatibility considerations
      description: Note permissions, destructive behavior, privacy, platform constraints, or backward compatibility.
