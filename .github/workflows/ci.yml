name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm audit --omit=dev
      - name: Verify the plugin manifest matches the packages
        shell: bash
        run: |
          set -Eeuo pipefail
          version="$(node -p "require('./package.json').version")"
          plugin="$(node -p "require('./plugin.json').version")"
          client="$(node -p "require('./packages/client/package.json').version")"
          runtime="$(node -p "require('./packages/runtime/package.json').version")"
          test "$version" = "$plugin" && test "$version" = "$client" && test "$version" = "$runtime"
          echo "all package versions are $version"
      - name: Verify the runtime advertises the documented tool count
        shell: bash
        run: |
          set -Eeuo pipefail
          count="$(node packages/runtime/src/index.mjs --print-tools | node -e 'let raw="";process.stdin.on("data",c=>raw+=c).on("end",()=>console.log(JSON.parse(raw).length))')"
          echo "runtime tools: $count"
          test "$count" -ge 20
      - name: Verify the runtime starts and answers MCP over stdio
        shell: bash
        run: |
          set -Eeuo pipefail
          npm --workspace packages/runtime run start -- --describe >/dev/null

  publish:
    name: publish to npm
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci --no-audit --no-fund
      - run: npm test
      # Trusted publishing: npm exchanges the GitHub OIDC token for a short-lived
      # credential, so no NPM_TOKEN secret and no one-time password are involved.
      # Configure it once per package on npmjs.com:
      #   Package settings -> Trusted Publisher -> GitHub Actions
      #   organization/user: antonbaider, repository: remcp, workflow: ci.yml
      - name: Publish @remcp/runtime
        run: npm publish --workspace packages/runtime --access public --provenance
      - name: Publish @remcp/remcp
        run: npm publish --workspace packages/client --access public --provenance
      - name: Verify the published versions resolve
        shell: bash
        run: |
          set -Eeuo pipefail
          version="$(node -p "require('./package.json').version")"
          for attempt in {1..10}; do
            if npm view "@remcp/runtime@$version" version >/dev/null 2>&1 && npm view "@remcp/remcp@$version" version >/dev/null 2>&1; then
              echo "published @remcp/runtime@$version and @remcp/remcp@$version"
              exit 0
            fi
            sleep 6
          done
          echo "published packages did not resolve from the registry" >&2
          exit 1
